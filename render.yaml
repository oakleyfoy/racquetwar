services:
  - type: web
    name: racquetwar-site
    runtime: node
    # The free plan idles after ~15 minutes and cold starts take 30-60 seconds,
    # which is too slow for a form linked from the live site.
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /tournament-director
    domains:
      - apply.wartournaments.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: racquetwar-db
          property: connectionString
      # Set these in the Render dashboard; they are intentionally not in git.
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: CTD_TO_EMAIL
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      # Where this app is served from, used for canonical and share URLs.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://apply.wartournaments.com
      # Where the logo and back button lead. racquetwar.com now only serves a
      # notice saying Racquet War events moved to War Tournaments.
      - key: NEXT_PUBLIC_MAIN_SITE_URL
        value: https://wartournaments.com/racquet-war/

databases:
  - name: racquetwar-db
    databaseName: racquetwar
    user: racquetwar
    # Render deletes free Postgres instances after 30 days, so a paid plan is
    # required for data that must persist.
    plan: basic-256mb
